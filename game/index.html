<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VIREO CITY</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-canvas {
      width: 100vw;
      height: 100vh;
      max-width: calc(100vh * 16 / 10);
      max-height: calc(100vw * 10 / 16);
      aspect-ratio: 16 / 10;
      display: block;
      background: #04070d;
      image-rendering: auto;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="1280" height="800"></canvas>
  </div>

  <script src="src/rng.js"></script>
  <script src="src/palette.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/input.js"></script>
  <script src="src/camera.js"></script>
  <script src="src/city.js"></script>
  <script src="src/vehicles.js"></script>
  <script src="src/traffic.js"></script>
  <script src="src/pedestrians.js"></script>
  <script src="src/weapons.js"></script>
  <script src="src/combat.js"></script>
  <script src="src/wanted.js"></script>
  <script src="src/police.js"></script>
  <script src="src/weather.js"></script>
  <script src="src/missions.js"></script>
  <script src="src/save.js"></script>
  <script src="src/player.js"></script>
  <script src="src/minimap.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/menu.js"></script>
  <script src="src/render.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
